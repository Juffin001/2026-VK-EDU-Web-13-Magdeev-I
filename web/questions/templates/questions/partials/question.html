{% load static %}
<div class="question-card">
    <div class="question-card-stats">
        <img src="{% static 'img/defualt-av.png' %}" alt="аватарка" class="question-card-avatar">
        <div class="question-card-votes">
            <button type="button" class="question-card-vote-btn" aria-label="Голос за">▲</button>
            <span class="question-card-vote-count">{{ question.votes }}</span>
            <button type="button" class="question-card-vote-btn" aria-label="Голос против">▼</button>
        </div>
    </div>
    <div class="question-card-body">
        <h3 class="question-card-title">
            <a href="{% url 'questions:question' %}?id={{ question.id }}">{{ question.title }}</a>
        </h3>
        <p class="question-card-text">
            {{ question.text }}
        </p>
        <div class="question-card-meta">
            <a href="{% url 'questions:question' %}?id={{ question.id }}" class="question-card-answers">ответ ({{ question.cnt_ans }})</a>

            <div class="question-card-tags">
                <span class="question-card-tags-label">Тэги:</span>
                {% for tag in question.tags %}
                <a href="{% url 'questions:tag' %}?id={{ tag.id }}" class="tag">{{ tag.text }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
