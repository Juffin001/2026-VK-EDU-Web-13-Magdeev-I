<footer class="footer">
        <div class="container footer-inner">
            <nav class="pagination" aria-label="Навигация по страницам">
                <ul class="pagination-list">
                    {% if page_obj.has_previous %}
                        <li>
                            <a href="{% querystring page=page_obj.previous_page_number %}" class="pagination-link" aria-label="Предыдущая страница">&laquo;</a>
                        </li>
                    {% endif %}
                    {% for num in page_obj.visible_numbers %}
                        {% if page_obj.number == num %}
                            <li>
                                <span class="pagination-link pagination-link-active" aria-current="page">{{ num }}</span>
                            </li>
                        {% else %}
                            <li>
                                <a href="{% querystring page=num %}" class="pagination-link">{{ num }}</a>
                            </li>
                        {% endif %}
                    {% endfor %}
                    {% if page_obj.has_next %}
                        <li>
                            <a href="{% querystring page=page_obj.next_page_number %}" class="pagination-link" aria-label="Следующая страница">&raquo;</a>
                        </li>
                    {% endif %}
                </ul>
            </nav>
        </div>
    </footer>
