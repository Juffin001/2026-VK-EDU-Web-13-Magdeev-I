<aside class="sidebar">
    <div class="sidebar-block">
        <h3 class="sidebar-title">
            Популярные тэги
        </h3>
        <div class="sidebar-tags">
            {% for tag in popular_tags %}
                <a href="{{ tag.get_absolute_url }}" class="sidebar-tag">{{ tag.text }}</a>
            {% empty %}
                <span>Пока нет популярных тегов.</span>
            {% endfor %}
        </div>
    </div>
    <div class="sidebar-block">
        <h3 class="sidebar-title">
            Лучшие пользователи
        </h3>
        <div class="sidebar-tags">
            {% for username in best_users %}
                <span class="sidebar-tag">{{ username }}</span>
            {% empty %}
                <span>Пока нет пользователей с профилем.</span>
            {% endfor %}
        </div>
    </div>
</aside>
