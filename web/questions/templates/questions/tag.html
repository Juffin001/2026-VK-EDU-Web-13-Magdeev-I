{% extends 'questions/layout/base.html' %}
{% load static %}

{% block content %}
<div class="all_questions">
{% for question in questions %}
    {% include 'questions/partials/question.html' with question=question card_tags=question.tags.all %}
{% empty %}
    <p>По этому тегу пока нет вопросов.</p>
{% endfor %}
</div>
{% endblock %}
