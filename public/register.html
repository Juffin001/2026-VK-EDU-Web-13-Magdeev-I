<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="сайт для вопросов">
    <title>AskAskTask</title>
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/base_style.css">

    <link rel="icon" href="static/img/favicon.png" type="image/png">
</head>
<body>

    <div data-include="partials/header.html"></div>

    <main>
        <div class="main-row">
            <div class="main-row-titles">
                <h1 class="hero-title">Зарегистрироваться</h1>
            </div>
        </div>
        <section class="hero">
            <form id="register-form" class="settings-form" action="#" method="POST">
                <div class="settings-row">
                    <label for="login" class="settings-label">Логин</label>
                    <input type="text" id="login" name="login" class="settings-input" placeholder="логин">
                </div>
                <div class="settings-row">
                    <label for="email" class="settings-label">Email</label>
                    <input type="email" id="email" name="email" class="settings-input" value="abracadabra@mail.ru">
                </div>
                <div class="settings-row">
                    <label for="password" class="settings-label">Пароль</label>
                    <input type="password" id="password" name="password" class="settings-input" placeholder="">
                </div>
                <div class="settings-row">
                    <label for="password-2" class="settings-label">Повторите пароль</label>
                    <input type="password" id="password-2" name="password" class="settings-input" placeholder="">
                </div>
                <div class="settings-row settings-row-avatar">
                    <span class="settings-label">Загрузить фото</span>
                    <div class="settings-avatar-block">
                        <div class="settings-file-input">
                            <input type="file" id="avatar" name="avatar" class="visually-hidden">                            
                            <label for="avatar" class="btn-solid theme-success">выбрать</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-solid theme-success">Зарегистрироваться</button>

            </form>
            <div data-include="partials/sidebar.html"></div>
        </section>
        
    </main>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="static/js/includes.js"></script>
    <script src="static/js/auth.js"></script>
</body>
</html>
