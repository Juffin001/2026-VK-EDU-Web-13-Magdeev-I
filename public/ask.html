<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="сайт для вопросов">
    <title>AskAskTask</title>
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/base_style.css">

    <link rel="icon" href="static/img/favicon.png" type="image/png">
</head>
<body>

    <div data-include="partials/header.html"></div>

    <main>
        <div class="main-row">
            <div class="main-row-titles">
                <h1 class="hero-title">Задать свой вопрос</h1>
            </div>
        </div>
        <section class="hero">
            <form id="register-form" class="settings-form" action="#" method="POST">

                <div class="ask-form-group">
                    <label for="question-title" class="ask-form-label">Заголовок</label>
                    <input type="text" id="question-title" name="title" class="ask-form-input" placeholder="Например: Как использовать тэг p в html?" maxlength="150">
                </div>

                <div class="ask-form-group">
                    <label for="question-text" class="ask-form-label">Полный вопрос</label>
                    <textarea id="question-text" name="text" class="ask-form-textarea" placeholder="Введите текст вопроса..." maxlength="3000"></textarea>
                </div>
                <div class="ask-form-group">
                    <label for="question-tags" class="ask-form-label">Теги</label>
                    <p class="ask-form-label">Добавьте до 5 тегов через запятую, чтобы ваш вопрос увидели нужные люди.</p>
                    <input type="text" id="question-tags" name="tags" class="ask-form-input" placeholder="javascript, css, верстка">
                </div>
                <button type="submit" class="btn-solid theme-success">Задать вопрос</button>

            </form>
            <div data-include="partials/sidebar.html"></div>
        </section>
        
    </main>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="static/js/includes.js"></script>
    <script src="static/js/auth.js"></script>
</body>
</html>
